name: Shell CI

on:
  push:
  pull_request:

concurrency:
  group: shell-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  noninteractive: "true"

jobs:
  bash-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' shell_files < <(
            find scripts panel_scripts extra_scripts tests \
              -type f -name '*.sh' -print0 | sort -z
          )
          ((${#shell_files[@]} > 0)) || exit 0
          for file in "${shell_files[@]}"; do
            bash -n "$file"
          done

      - name: Run shell tests
        shell: bash
        run: |
          set -euo pipefail
          bash tests/image_lookup_test.sh
          bash tests/build_ipv6_network_test.sh
          bash tests/build_failure_control_flow_test.sh
          bash tests/storage_pool_preservation_test.sh
          bash tests/batch_transaction_test.sh

      - name: Check shell lint errors
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' shell_files < <(
            find scripts panel_scripts extra_scripts tests \
              -type f -name '*.sh' -print0 | sort -z
          )
          ((${#shell_files[@]} > 0)) || exit 0
          shellcheck -S error -- "${shell_files[@]}"
